services:
  db: # used for local testing only, does not persist storage
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: du_chapters
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d du_chapters"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - du-postgres

networks:
  du-postgres:
    name: du-postgres
