name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for AWS OIDC federation
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: du-university-chapters-etl

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init

      - name: Ensure the ECR repository exists
        working-directory: infrastructure
        run: terraform apply -auto-approve -target=aws_ecr_repository.etl

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            --push .

      - name: Deploy the infrastructure
        working-directory: infrastructure
        run: terraform apply -auto-approve -var="image_uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
