name: Terraform Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for AWS OIDC federation when a deploy role is configured
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: du-university-chapters-etl

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      
      # Try to use OIDC to authenticate
      - name: Configure AWS credentials via OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # If OIDC doesn't work, then use static keys
      - name: Configure AWS credentials via static keys
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve the image URI for this commit
        run: echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init -input=false

      - name: Ensure the ECR repository exists
        working-directory: infrastructure
        run: terraform apply -auto-approve -input=false -var="image_uri=${{ env.IMAGE_URI }}" -target=aws_ecr_repository.etl

      - name: Build and push the image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --tag "${{ env.IMAGE_URI }}" \
            --tag "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            --push .

      - name: Deploy the infrastructure
        working-directory: infrastructure
        run: terraform apply -auto-approve -input=false -var="image_uri=${{ env.IMAGE_URI }}"
